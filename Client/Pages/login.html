<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login</title>
    <link href="../CSS/loginStyle.css" rel="stylesheet" />
    <script src="https://code.jquery.com/jquery-4.0.0.min.js" integrity="sha256-OaVG6prZf4v69dPg6PhVattBXkcOWQB62pdZ3ORyrao=" crossorigin="anonymous"></script>
    <script src="../JS/apiRoutes.js"></script>
    <script src="../JS/ajaxCalls.js"></script>
    <script src="../JS/login.js"></script>
</head>
<body>
    <div class="container">
        <div id="login-section" class="login-wrapper">
            <h2 class="login-title">Sign In</h2>
            <form id="login-form">
                <div class="form-group">
                    <label for="email">Email</label>
                    <input type="email" id="email" name="email" placeholder="email@example.com" required />
                </div>
                <div class="form-group">
                    <label for="password">Password</label>
                    <input type="password" id="password" name="password" placeholder="••••••••" required />
                </div>
                <div id="login-error" class="login-error"></div>
                <div id="login-success" class="login-success hidden"></div>
                <input type="button" class="login-btn" value="Login" />
                <div class="register-link">
                    <span>New user?</span>
                    <a href="#">Click here to register</a>
                </div>
            </form>
        </div>

        <div id="register-section" class="login-wrapper hidden" autocomplete="off">
            <h2 class="login-title">Create Account</h2>
            <form id="register-form">
                <!-- Combined registration form: basic details + languages + continents -->
                <div class="form-group">
                    <label for="reg-name">Username</label>
                    <input type="text" id="reg-name" name="name" placeholder="MichaelJackson123" autocomplete="off" required />
                </div>
                <div class="form-group">
                    <label for="reg-email">Email</label>
                    <input type="email" id="reg-email" name="email" placeholder="email@example.com" autocomplete="off" required />
                </div>
                <div class="form-group">
                    <label for="reg-password">Password</label>
                    <input type="password" id="reg-password" name="password" placeholder="••••••••" autocomplete="new-password" required />
                </div>
                <h2 class="login-title">Add Preferences</h2>
                <div class="form-group">
                    <h4>Add languages you speak</h4>
                    <div class="language-control">
                        <!-- default if error accure-->
                        <select id="lang-select">
                            <option value="English">English</option>
                            <option value="Spanish">Spanish</option>
                            <option value="Hebrew">Hebrew</option>
                            <option value="German">German</option>
                            <option value="Chinese">Chinese</option>
                        </select>
                        <select id="lang-level-select">
                            <option value="0">Beginner</option>
                            <option value="1">Intermediate</option>
                            <option value="2">Advanced</option>
                        </select>
                        <input type="button" id="add-language-btn" class="login-btn btn-small" value="Add" />
                    </div>
                    <ul id="languages-list" class="languages-list">
                    </ul>
                </div>

                <div class="form-group">
                    <h4>Preferred Continents</h4>
                    <div class="continents-grid">
                        <label><input type="checkbox" name="continent" value="Africa" /> Africa</label>
                        <label><input type="checkbox" name="continent" value="Asia" /> Asia</label>
                        <label><input type="checkbox" name="continent" value="Europe" /> Europe</label>
                        <label><input type="checkbox" name="continent" value="Americas" /> Americas</label>
                        <label><input type="checkbox" name="continent" value="Oceania" /> Oceania</label>
                        <label><input type="checkbox" name="continent" value="Antarctic" /> Antarctic</label>
                    </div>
                </div>

                <div id="register-error" class="login-error"></div>
                <input type="button" id="final-register-btn" class="login-btn" value="Register" />
                <div class="register-link" style="margin-top:8px;">
                    <span>Already have an account?</span>
                    <a href="#">Sign in here</a>
                </div>
            </form>
        </div>

        <a href="index.html" class="back-to-map">← Back to the map</a>
    </div>
</body>
</html>
